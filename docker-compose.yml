services:
  lmnp:
    build: .
    expose:
      - "8080"
    volumes:
      - ./backend/data:/app/backend/data

  https:
    image: caddy:2.8-alpine
    depends_on:
      - lmnp
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
